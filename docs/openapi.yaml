openapi: 3.0.3
info:
  title: TJudge API
  description: |
    REST API for TJudge -- a high-performance tournament system for competitive game-theory
    programming. Strategy programs (bots) compete against each other in games such as
    Prisoner's Dilemma, Tug of War, Traveler's Dilemma, Public Goods, and Double Price Auction.

    ## Authentication
    Protected endpoints require a JWT Bearer token in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```

    ## Response Format
    All successful responses (except 204 and file downloads) use the standard envelope:
    ```json
    {
      "data": <payload>,
      "message": "optional message",
      "meta": { "total": 100, "limit": 50, "offset": 0 }
    }
    ```
    `message` and `meta` are omitted when empty.

    All error responses use:
    ```json
    {
      "error": "Human-readable error message"
    }
    ```

    ## Rate Limiting
    - 100 requests per minute per IP address.
    - Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`.

    ## WebSocket
    WebSocket connections require JWT authentication via the `Sec-WebSocket-Protocol` subprotocol
    header: `access_token.<jwt>`.
  version: 1.0.0
  contact:
    name: BMSTU ITS Tech
    url: https://github.com/bmstu-itstech/tjudge
  license:
    name: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development
  - url: https://api.tjudge.example.com/api/v1
    description: Production

tags:
  - name: auth
    description: Authentication and authorization
  - name: tournaments
    description: Tournament management and lifecycle
  - name: games
    description: Game definitions and tournament-game links
  - name: teams
    description: Team management
  - name: programs
    description: Program (bot) management and file upload
  - name: matches
    description: Match information, statistics, and queue management
  - name: websocket
    description: Real-time updates via WebSocket
  - name: system
    description: System health, metrics, and administration

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # Auth
  # ==========================================================================

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: Authenticate with username or email and password. Returns JWT tokens.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh tokens
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Blacklists the current access token and optionally the refresh token.
      operationId: authLogout
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional refresh token to invalidate
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [auth]
      summary: Get current user
      operationId: authMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    put:
      tags: [auth]
      summary: Update profile
      description: Update email or password for the current user. Requires current_password for password changes.
      operationId: authUpdateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # Tournaments
  # ==========================================================================

  /tournaments:
    get:
      tags: [tournaments]
      summary: List tournaments
      operationId: tournamentsList
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, completed, cancelled]
        - name: game_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tournament list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [tournaments]
      summary: Create tournament (admin)
      operationId: tournamentsCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTournamentRequest'
      responses:
        '201':
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [tournaments]
      summary: Get tournament
      operationId: tournamentsGet
      responses:
        '200':
          description: Tournament data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tournaments]
      summary: Delete tournament (admin)
      operationId: tournamentsDelete
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Tournament deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/start:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Start tournament (admin)
      description: Transitions the tournament to active status.
      operationId: tournamentsStart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Complete tournament (admin)
      description: Transitions the tournament to completed status.
      operationId: tournamentsComplete
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tournament completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/join:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Join tournament
      operationId: tournamentsJoin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [program_id]
              properties:
                program_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tournaments/{id}/leaderboard:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [tournaments]
      summary: Tournament leaderboard
      operationId: tournamentsGetLeaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Leaderboard entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/cross-game-leaderboard:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [tournaments]
      summary: Cross-game leaderboard
      description: Aggregated ratings across all games in the tournament.
      operationId: tournamentsGetCrossGameLeaderboard
      responses:
        '200':
          description: Cross-game leaderboard entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossGameLeaderboardListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [tournaments]
      summary: Tournament matches
      operationId: tournamentsGetMatches
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Match list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tournaments]
      summary: Create match (admin)
      operationId: tournamentsCreateMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}/matches/rounds:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [tournaments]
      summary: Matches grouped by rounds
      operationId: tournamentsGetMatchesByRounds
      responses:
        '200':
          description: Match rounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRoundListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/run-matches:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Run all pending matches (admin)
      description: Enqueues all pending matches for the tournament.
      operationId: tournamentsRunAllMatches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Matches enqueued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: started
                          enqueued:
                            type: integer
                            example: 45
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/run-game-matches:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Run matches for a specific game (admin)
      operationId: tournamentsRunGameMatches
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_type]
              properties:
                game_type:
                  type: string
                  description: The system name of the game
      responses:
        '200':
          description: Game matches enqueued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: started
                          game_type:
                            type: string
                            example: prisoners_dilemma
                          enqueued:
                            type: integer
                            example: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}/retry-matches:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [tournaments]
      summary: Retry failed matches (admin)
      description: Re-enqueues all failed matches for the tournament.
      operationId: tournamentsRetryFailedMatches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Failed matches re-enqueued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: retried
                          enqueued:
                            type: integer
                            example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/my-team:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [teams]
      summary: Get my team in tournament
      description: Returns the current user's team in the specified tournament, or null if none.
      operationId: tournamentsGetMyTeam
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's team (or null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamNullableEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tournaments/{id}/teams:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [teams]
      summary: List tournament teams
      operationId: tournamentsGetTeams
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # Games -- CRUD
  # ==========================================================================

  /games:
    get:
      tags: [games]
      summary: List games
      operationId: gamesList
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Game list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListEnvelope'
    post:
      tags: [games]
      summary: Create game (admin)
      operationId: gamesCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /games/{id}:
    parameters:
      - $ref: '#/components/parameters/GameID'
    get:
      tags: [games]
      summary: Get game by ID
      operationId: gamesGet
      responses:
        '200':
          description: Game data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [games]
      summary: Update game (admin)
      operationId: gamesUpdate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameRequest'
      responses:
        '200':
          description: Game updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [games]
      summary: Delete game (admin)
      operationId: gamesDelete
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Game deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/name/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: System name of the game
    get:
      tags: [games]
      summary: Get game by system name
      operationId: gamesGetByName
      responses:
        '200':
          description: Game data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # Games -- Tournament links, rounds, status
  # ==========================================================================

  /tournaments/{id}/games:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [games]
      summary: List games in tournament
      operationId: tournamentGamesList
      responses:
        '200':
          description: Games linked to the tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [games]
      summary: Add game to tournament (creator/admin)
      operationId: tournamentGamesAdd
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id]
              properties:
                game_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Game added to tournament
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
      - $ref: '#/components/parameters/GameIDPath'
    delete:
      tags: [games]
      summary: Remove game from tournament (admin)
      operationId: tournamentGamesRemove
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Game removed from tournament
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/games/status:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [games]
      summary: Tournament games with round status
      operationId: tournamentGamesStatus
      responses:
        '200':
          description: Games with round/auto-round status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentGameWithDetailsListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/active-game:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [games]
      summary: Get active game
      description: Returns the currently active game for the tournament, or null.
      operationId: tournamentActiveGameGet
      responses:
        '200':
          description: Active game (or null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentGameWithDetailsNullableEnvelope'
    post:
      tags: [games]
      summary: Set active game (admin)
      operationId: tournamentActiveGameSet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game_id]
              properties:
                game_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Active game set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tournaments/{id}/games/deactivate-all:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    post:
      tags: [games]
      summary: Deactivate all games (admin)
      operationId: tournamentGamesDeactivateAll
      security:
        - BearerAuth: []
      responses:
        '204':
          description: All games deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/games/{gameId}/leaderboard:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
      - $ref: '#/components/parameters/GameIDPath'
    get:
      tags: [games]
      summary: Game leaderboard
      operationId: tournamentGameLeaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Leaderboard for the game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/games/{gameId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
      - $ref: '#/components/parameters/GameIDPath'
    get:
      tags: [games]
      summary: Game matches
      operationId: tournamentGameMatches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matches for the game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /tournaments/{id}/games/{gameId}/programs:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
      - $ref: '#/components/parameters/GameIDPath'
    get:
      tags: [games]
      summary: Game programs (admin)
