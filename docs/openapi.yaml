        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [teams]
      summary: Delete team (admin)
      operationId: teamsDelete
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Team deleted
