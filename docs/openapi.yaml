  # ==========================================================================
  # Programs
  # ==========================================================================

  /programs:
    get:
      tags: [programs]
      summary: List my programs
      operationId: programsList
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Program list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [programs]
      summary: Create / upload program
      description: |
        Supports two content types:
        - `multipart/form-data` -- file upload with form fields (team_id, tournament_id, game_id, name, file).
        - `application/json` -- JSON body with code_path, name, game_type, language.

        Maximum file size: 10 MB.
      operationId: programsCreate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, team_id, tournament_id, game_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: Program source file
                team_id:
                  type: string
                  format: uuid
                tournament_id:
                  type: string
                  format: uuid
                game_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  description: Display name (defaults to filename)
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                game_type:
                  type: string
                code_path:
                  type: string
                language:
                  type: string
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /programs/versions:
    get:
      tags: [programs]
      summary: Get program versions
      description: Returns all versions of programs for a specific team and game.
      operationId: programsGetVersions
      security:
        - BearerAuth: []
      parameters:
        - name: team_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: game_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Program versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /programs/{id}:
    parameters:
      - $ref: '#/components/parameters/ProgramID'
    get:
      tags: [programs]
      summary: Get program
      operationId: programsGet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Program data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [programs]
      summary: Update program
      operationId: programsUpdate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgramRequest'
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [programs]
      summary: Delete program
      operationId: programsDelete
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Program deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{id}/download:
    parameters:
      - $ref: '#/components/parameters/ProgramID'
    get:
      tags: [programs]
      summary: Download program file
      operationId: programsDownload
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Program source file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # Matches
  # ==========================================================================

  /matches:
    get:
      tags: [matches]
      summary: List matches
      description: Returns matches with optional filters. Authenticated admins see full error messages.
      operationId: matchesList
      parameters:
        - name: tournament_id
          in: query
          schema:
            type: string
            format: uuid
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: game_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Match list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /matches/{id}:
    parameters:
      - $ref: '#/components/parameters/MatchID'
    get:
      tags: [matches]
      summary: Get match
      operationId: matchesGet
      responses:
        '200':
          description: Match data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /matches/statistics:
    get:
      tags: [matches]
      summary: Match statistics
      operationId: matchesGetStatistics
      parameters:
        - name: tournament_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated match statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MatchStatistics'

  /matches/queue/stats:
    get:
      tags: [matches]
      summary: Queue statistics (admin)
      operationId: matchesQueueStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Queue statistics by priority
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QueueStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /matches/queue/clear:
    post:
      tags: [matches]
      summary: Clear match queue (admin)
      operationId: matchesQueueClear
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Queue cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: All queues cleared successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /matches/queue/purge:
    post:
      tags: [matches]
      summary: Purge invalid matches from queue (admin)
      description: Removes queue entries whose match no longer exists in the database.
      operationId: matchesQueuePurge
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invalid matches purged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                          purged_count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================================================
  # WebSocket
  # ==========================================================================

  /ws/tournaments/{id}:
    parameters:
      - $ref: '#/components/parameters/TournamentID'
    get:
      tags: [websocket]
      summary: Tournament WebSocket
      description: |
        Upgrades to a WebSocket connection for real-time tournament updates.
        Authentication via subprotocol header: `Sec-WebSocket-Protocol: access_token.<jwt>`.

        **Server-sent message types:**
        - `match_completed` -- a match has finished
        - `leaderboard_updated` -- leaderboard changed
        - `tournament_started` -- tournament transitioned to active
        - `tournament_completed` -- tournament finished
        - `round_completed` -- a game round was completed
        - `round_reset` -- a game round was reset
      operationId: wsTournament
      security:
        - BearerAuth: []
      responses:
        '101':
          description: WebSocket connection established
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ws/stats:
    get:
      tags: [websocket]
      summary: WebSocket connection stats
      operationId: wsStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: WebSocket hub statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_clients:
                            type: integer
                          tournaments:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # System
  # ==========================================================================

  /system/metrics:
    get:
      tags: [system]
      summary: System metrics (admin)
      description: Returns CPU, memory, disk, host, and Go runtime metrics.
      operationId: systemMetrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/status:
    get:
      tags: [system]
      summary: Full system status (admin)
      description: >-
        Полное состояние системы одним ответом: версия и аптайм процесса,
        здоровье и пул соединений БД, версия миграций, здоровье Redis,
        размеры всех очередей (приоритеты, dead-letter, компиляция),
        матчи и программы по статусам, outbox пост-обработки,
        WebSocket-подключения.
      operationId: systemFullStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Full system status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FullSystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/recovery/outbox-retry:
    post:
      tags: [system]
      summary: Retry failed outbox tasks (admin)
      operationId: systemRecoveryOutboxRetry
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Number of retried tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          retried:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/recovery/requeue-compiling:
    post:
      tags: [system]
      summary: Requeue stuck compiling programs (admin)
      operationId: systemRecoveryRequeueCompiling
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Number of requeued programs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requeued:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/recovery/reset-stuck-matches:
    post:
      tags: [system]
      summary: Reset stuck running matches back to queue (admin)
      operationId: systemRecoveryResetStuckMatches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Number of reset matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/recovery/clear-dead-letter:
    post:
      tags: [system]
      summary: Clear dead-letter queue (admin)
      operationId: systemRecoveryClearDeadLetter
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Number of cleared entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cleared:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/health:
    get:
      tags: [system]
      summary: System health (admin)
      operationId: systemHealth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # ========== Security Schemes ==========

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login or /auth/register

  # ========== Parameters ==========

  parameters:
    TournamentID:
      name: id
      in: path
      required: true
      description: Tournament UUID
      schema:
        type: string
        format: uuid

    TeamID:
      name: id
      in: path
      required: true
      description: Team UUID
      schema:
        type: string
        format: uuid

    GameID:
      name: id
      in: path
      required: true
      description: Game UUID
      schema:
        type: string
        format: uuid

    GameIDPath:
      name: gameId
      in: path
      required: true
      description: Game UUID (in tournament context)
      schema:
        type: string
        format: uuid

    ProgramID:
      name: id
      in: path
      required: true
      description: Program UUID
      schema:
        type: string
        format: uuid

    MatchID:
      name: id
      in: path
      required: true
      description: Match UUID
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      description: Maximum number of records to return
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

    Offset:
      name: offset
      in: query
      description: Number of records to skip
      schema:
        type: integer
        default: 0
        minimum: 0

  # ========== Schemas ==========

  schemas:

    # ---------- Envelope wrappers ----------

    SuccessEnvelope:
      type: object
      description: Standard success response envelope
      properties:
        data: {}
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    # ---------- Auth ----------

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: player42
        email:
          type: string
          format: email
          example: player42@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password

    LoginRequest:
      type: object
      required: [password]
      description: Login with username OR email plus password.
      properties:
        username:
          type: string
          example: player42
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        current_password:
          type: string
          format: password
          description: Required when changing password

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    AuthResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthResponse'

    # ---------- User ----------

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    UserListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    # ---------- Tournament ----------

    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          description: Unique 6-character tournament code
        description:
          type: string
        game_type:
          type: string
        status:
          type: string
          enum: [pending, active, completed, cancelled]
        max_participants:
          type: integer
          nullable: true
        max_team_size:
          type: integer
        is_permanent:
          type: boolean
        creator_id:
          type: string
          format: uuid
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTournamentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        game_type:
          type: string
        max_participants:
          type: integer
          nullable: true
        max_team_size:
          type: integer
        is_permanent:
          type: boolean
        start_time:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    TournamentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Tournament'

    TournamentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tournament'

    StatusEnvelope:
      description: Generic status response wrapped in envelope
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string

    # ---------- Game ----------

    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique system name (lowercase, a-z0-9_)
        display_name:
          type: string
        rules:
          type: string
          description: Rules in Markdown format
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGameRequest:
      type: object
      required: [name, display_name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique system name (lowercase, a-z0-9_)
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        rules:
          type: string

    UpdateGameRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        rules:
          type: string

    GameEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Game'

    GameListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Game'

    TournamentGameWithDetails:
      type: object
      properties:
        tournament_id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        game_name:
          type: string
        game_display_name:
          type: string
        is_active:
          type: boolean
        round_completed:
          type: boolean
        round_completed_at:
          type: string
          format: date-time
          nullable: true
        current_round:
          type: integer
        auto_round_enabled:
          type: boolean
        auto_round_interval_seconds:
          type: integer
        auto_round_last_run_at:
          type: string
          format: date-time
          nullable: true

    TournamentGameWithDetailsListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TournamentGameWithDetails'

    TournamentGameWithDetailsNullableEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/TournamentGameWithDetails'

    AutoRoundSettings:
      type: object
      properties:
        enabled:
          type: boolean
        interval_seconds:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true

    ResetGameRoundResponse:
      type: object
      properties:
        matches_deleted:
          type: integer
        participants_reset:
          type: integer
        rating_history_reset:
          type: integer

    # ---------- Team ----------

    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournament_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          description: Unique 6-8 character invite code
        leader_id:
          type: string
          format: uuid
        is_disqualified:
          type: boolean
        disqualified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamWithMembers:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/User'

    CreateTeamRequest:
      type: object
      required: [tournament_id, name]
      properties:
        tournament_id:
          type: string
          format: uuid
        name:
          type: string

    InviteLinkResponse:
      type: object
      properties:
        code:
          type: string
        link:
          type: string
          format: uri

    DisqualifyResult:
      type: object
      properties:
        matches_deleted:
          type: integer
          format: int64
        matches_cancelled:
          type: integer
          format: int64
        rating_history_reset:
          type: integer
          format: int64

    TeamEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Team'

    TeamNullableEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Team'

    TeamListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Team'

    TeamWithMembersEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TeamWithMembers'

    # ---------- Program ----------

    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        game_type:
          type: string
        language:
          type: string
          description: Detected or specified language (python, cpp, c, go, rust, java, javascript, ruby, php, lua)
        status:
          type: string
          enum: [compiling, ready, failed]
          description: >-
            Жизненный цикл программы: compiling - в очереди или компилируется
            в Docker-песочнице worker'а; ready - готова к матчам; failed -
            компиляция/проверка синтаксиса не прошла (см. error_message).
        team_id:
          type: string
          format: uuid
          nullable: true
        tournament_id:
          type: string
          format: uuid
          nullable: true
        game_id:
          type: string
          format: uuid
          nullable: true
        error_message:
          type: string
          nullable: true
          description: Syntax or compilation error, if any
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateProgramRequest:
      type: object
      properties:
        name:
          type: string
        code_path:
          type: string
        language:
          type: string

    ProgramEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Program'

    ProgramListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Program'

    # ---------- Match ----------

    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournament_id:
          type: string
          format: uuid
        program1_id:
          type: string
          format: uuid
        program2_id:
          type: string
          format: uuid
        game_type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        priority:
          type: string
          enum: [high, medium, low]
        round_number:
          type: integer
        score1:
          type: integer
          nullable: true
        score2:
          type: integer
          nullable: true
        winner:
          type: integer
          nullable: true
          description: "0 = draw, 1 = program1 won, 2 = program2 won"
        error_code:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
          description: Filtered based on user permissions
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    MatchRound:
      type: object
      properties:
        round_number:
          type: integer
        game_type:
          type: string
        total_matches:
          type: integer
        completed_count:
          type: integer
        pending_count:
          type: integer
        running_count:
          type: integer
        failed_count:
          type: integer
        matches:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        created_at:
          type: string
          format: date-time

    CreateMatchRequest:
      type: object
      required: [program1_id, program2_id]
      properties:
        program1_id:
          type: string
          format: uuid
        program2_id:
          type: string
          format: uuid
        priority:
          type: string
          enum: [high, medium, low]
          default: medium

    MatchStatistics:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        running:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    QueueStats:
      type: object
      properties:
        high:
          type: integer
          format: int64
          description: Matches in high-priority queue
        medium:
          type: integer
          format: int64
          description: Matches in medium-priority queue
        low:
          type: integer
          format: int64
          description: Matches in low-priority queue
        total:
          type: integer
          format: int64

    MatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Match'

    MatchListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Match'

    MatchRoundListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MatchRound'

    # ---------- Leaderboard ----------

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        program_id:
          type: string
          format: uuid
        program_name:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
          nullable: true
        rating:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        total_games:
          type: integer

    CrossGameLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        team_id:
          type: string
          format: uuid
          nullable: true
        team_name:
          type: string
        program_id:
          type: string
          format: uuid
        program_name:
          type: string
        game_ratings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GameRatingInfo'
          description: Map of game_id to rating info
        total_rating:
          type: integer
        total_wins:
          type: integer
        total_losses:
          type: integer
        total_games:
          type: integer

    GameRatingInfo:
      type: object
      properties:
        game_id:
          type: string
          format: uuid
        game_name:
          type: string
        rating:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        total_games:
          type: integer

    LeaderboardListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LeaderboardEntry'

    CrossGameLeaderboardListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CrossGameLeaderboardEntry'

    # ---------- System ----------

    SystemMetrics:
      type: object
      properties:
        cpu:
          type: object
          properties:
            usage_percent:
              type: number
              format: double
            cores:
              type: integer
            model_name:
              type: string
            per_core:
              type: array
              items:
                type: number
                format: double
        memory:
          type: object
          properties:
            total:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            free:
              type: integer
              format: int64
            used_percent:
              type: number
              format: double
        disk:
          type: object
          properties:
            total:
              type: integer
              format: int64
            used:
              type: integer
              format: int64
            free:
              type: integer
              format: int64
            used_percent:
              type: number
              format: double
            path:
              type: string
        host:
          type: object
          properties:
            hostname:
              type: string
            platform:
              type: string
            platform_version:
              type: string
            os:
              type: string
            arch:
              type: string
            uptime:
              type: integer
              format: int64
        go:
          type: object
          properties:
            version:
              type: string
            goroutines:
              type: integer
            heap_alloc:
              type: integer
              format: int64
            heap_sys:
              type: integer
              format: int64
            num_gc:
              type: integer
            gomaxprocs:
              type: integer
        temperature:
          type: array
          items:
            type: object
            properties:
              sensor_key:
                type: string
              temperature:
                type: number
                format: double

    FullSystemStatus:
      type: object
      properties:
        app:
          type: object
          properties:
            version:
              type: string
              description: Короткий vcs.revision сборки или "dev"
            build_time:
              type: string
            dirty:
              type: boolean
              description: Сборка из дерева с незакоммиченными изменениями
            go_version:
              type: string
            started_at:
              type: string
              format: date-time
            uptime_seconds:
              type: integer
        database:
          type: object
          properties:
            healthy:
              type: boolean
            schema_version:
              type: integer
              description: Версия миграций из schema_migrations
            schema_dirty:
              type: boolean
            open_connections:
              type: integer
            in_use:
              type: integer
            idle:
              type: integer
            max_open:
              type: integer
        redis:
          type: object
          properties:
            healthy:
              type: boolean
        queues:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            total:
              type: integer
            dead_letter:
              type: integer
            compile:
              type: integer
        matches:
          type: object
          properties:
            by_status:
              type: object
              additionalProperties:
                type: integer
            stuck_running:
              type: integer
              description: Матчи в running дольше 2 минут (чинится кнопкой восстановления)
            last_completed_at:
              type: string
              format: date-time
              nullable: true
        programs:
          type: object
          description: Число программ в каждом статусе (compiling/ready/failed)
          additionalProperties:
            type: integer
        outbox:
          type: object
          nullable: true
          properties:
            pending:
              type: integer
            errors:
              type: integer
            done_last_24h:
              type: integer
            oldest_pending_age_seconds:
              type: number
              nullable: true
            last_processed_at:
              type: string
              format: date-time
              nullable: true
        websocket:
          type: object
          properties:
            tournaments:
              type: integer
            total_clients:
              type: integer

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, warning]
        timestamp:
          type: string
          format: date-time
        hostname:
          type: string
        pid:
          type: integer
        warning:
          type: string
          description: Present only when status is warning

  # ========== Responses ==========

  responses:
    BadRequest:
      description: Bad request (validation error or invalid input)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "invalid input: email is required"

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "unauthorized"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "not found"

    Conflict:
      description: Resource conflict (already exists, already started, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "resource already exists"
