basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  auth.UpdateProfileRequest:
    properties:
      current_password:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  db.MatchStatistics:
    properties:
      completed:
        type: integer
      failed:
        type: integer
      pending:
        type: integer
      running:
        type: integer
      total:
        type: integer
    type: object
  domain.CrossGameLeaderboardEntry:
    properties:
      game_ratings:
        additionalProperties:
          $ref: '#/definitions/domain.GameRatingInfo'
        description: game_id -> rating info
        type: object
      program_id:
        type: string
      program_name:
        type: string
      rank:
        type: integer
      team_id:
        type: string
      team_name:
        type: string
      total_games:
        type: integer
      total_losses:
        type: integer
      total_rating:
        type: integer
      total_wins:
        type: integer
    type: object
  domain.Game:
    properties:
      created_at:
        type: string
      display_name:
        description: Название для отображения
        type: string
      id:
        type: string
      name:
        description: Уникальное название [a-z0-9_]+
        type: string
      rules:
        description: Правила в формате Markdown
        type: string
      updated_at:
        type: string
    type: object
  domain.GameRatingInfo:
    properties:
      draws:
        type: integer
      game_id:
        type: string
      game_name:
        type: string
      losses:
        type: integer
      rating:
        type: integer
      total_games:
        type: integer
      wins:
        type: integer
    type: object
  domain.LeaderboardEntry:
    properties:
      draws:
        type: integer
      losses:
        type: integer
      program_id:
        type: string
      program_name:
        type: string
      rank:
        type: integer
      rating:
        type: integer
      team_id:
        type: string
      team_name:
        type: string
      total_games:
        type: integer
      wins:
        type: integer
    type: object
  domain.Match:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      error_code:
        type: integer
      error_message:
        type: string
      game_type:
        type: string
      id:
        type: string
      priority:
        $ref: '#/definitions/domain.MatchPriority'
      program1_id:
        type: string
      program2_id:
        type: string
      round_number:
        description: Номер раунда для группировки
        type: integer
      score1:
        type: integer
      score2:
        type: integer
      started_at:
        type: string
      status:
        $ref: '#/definitions/domain.MatchStatus'
      tournament_id:
        type: string
      winner:
        type: integer
    type: object
  domain.MatchPriority:
    enum:
    - high
    - medium
    - low
    type: string
    x-enum-varnames:
    - PriorityHigh
    - PriorityMedium
    - PriorityLow
  domain.MatchRound:
    properties:
      completed_count:
        type: integer
      created_at:
        type: string
      failed_count:
        type: integer
      game_type:
        type: string
      matches:
        items:
          $ref: '#/definitions/domain.Match'
        type: array
      pending_count:
        type: integer
      round_number:
        type: integer
      running_count:
        type: integer
      total_matches:
        type: integer
    type: object
  domain.MatchStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - MatchPending
    - MatchRunning
    - MatchCompleted
    - MatchFailed
    - MatchCancelled
  domain.Program:
    properties:
      created_at:
        type: string
      error_message:
        type: string
      game_id:
        type: string
      game_type:
        type: string
      id:
        type: string
      language:
        type: string
      name:
        type: string
      team_id:
        type: string
      tournament_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      version:
        type: integer
    type: object
  domain.Role:
    enum:
    - user
    - admin
    type: string
    x-enum-comments:
      RoleAdmin: Администратор
      RoleUser: Обычный пользователь
    x-enum-descriptions:
    - Обычный пользователь
    - Администратор
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
  domain.Team:
    properties:
      code:
        description: 6-8 символов уникальный код
        type: string
      created_at:
        type: string
      disqualified_at:
        type: string
      id:
        type: string
      is_disqualified:
        type: boolean
      leader_id:
        type: string
      name:
        type: string
      tournament_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.TeamWithMembers:
    properties:
      code:
        description: 6-8 символов уникальный код
        type: string
      created_at:
        type: string
      disqualified_at:
        type: string
      id:
        type: string
      is_disqualified:
        type: boolean
      leader_id:
        type: string
      members:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      name:
        type: string
      tournament_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.Tournament:
    properties:
      code:
        description: 6-8 символов уникальный код
        type: string
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      game_type:
        type: string
      id:
        type: string
      is_permanent:
        type: boolean
      max_participants:
        type: integer
      max_team_size:
        type: integer
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      start_time:
        type: string
      status:
        $ref: '#/definitions/domain.TournamentStatus'
      updated_at:
        type: string
      version:
        type: integer
    type: object
  domain.TournamentStatus:
    enum:
    - pending
    - active
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - TournamentPending
    - TournamentActive
    - TournamentCompleted
    - TournamentCancelled
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      updated_at:
        type: string
      username:
        type: string
    type: object
  game.CreateRequest:
    properties:
      display_name:
        maxLength: 255
        minLength: 1
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      rules:
        type: string
    required:
    - display_name
    - name
    type: object
  game.UpdateRequest:
    properties:
      display_name:
        maxLength: 255
        minLength: 1
        type: string
      rules:
        type: string
    required:
    - display_name
    type: object
  handlers.AddGameToTournamentRequest:
    properties:
      game_id:
        type: string
    type: object
  handlers.CPUMetrics:
    properties:
      cores:
        type: integer
      model_name:
        type: string
      per_core:
        items:
          type: number
        type: array
      usage_percent:
        type: number
    type: object
  handlers.CreateTeamRequest:
    properties:
      name:
        type: string
      tournament_id:
        type: string
    type: object
  handlers.DiskMetrics:
    properties:
      free:
        type: integer
      path:
        type: string
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  handlers.GoMetrics:
    properties:
      gomaxprocs:
        type: integer
      goroutines:
        type: integer
      heap_alloc:
        type: integer
      heap_sys:
        type: integer
      num_gc:
        type: integer
      version:
        type: string
    type: object
  handlers.HostMetrics:
    properties:
      arch:
        type: string
      hostname:
        type: string
      os:
        type: string
      platform:
        type: string
      platform_version:
        type: string
      uptime:
        type: integer
    type: object
  handlers.InviteLinkResponse:
    properties:
      code:
        type: string
      link:
        type: string
    type: object
  handlers.JoinByCodeRequest:
    properties:
      code:
        type: string
    type: object
  handlers.MemoryMetrics:
    properties:
      free:
        type: integer
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  handlers.ResetGameRoundResponse:
    properties:
      matches_deleted:
        type: integer
      participants_reset:
        type: integer
      rating_history_reset:
        type: integer
    type: object
  handlers.SetActiveGameRequest:
    properties:
      game_id:
        type: string
    type: object
  handlers.SystemMetrics:
    properties:
      cpu:
        $ref: '#/definitions/handlers.CPUMetrics'
      disk:
        $ref: '#/definitions/handlers.DiskMetrics'
      go:
        $ref: '#/definitions/handlers.GoMetrics'
      host:
        $ref: '#/definitions/handlers.HostMetrics'
      memory:
        $ref: '#/definitions/handlers.MemoryMetrics'
      temperature:
        items:
          $ref: '#/definitions/handlers.TemperatureInfo'
        type: array
    type: object
  handlers.TemperatureInfo:
    properties:
      sensor_key:
        type: string
      temperature:
        type: number
    type: object
  handlers.TournamentGameWithDetails:
    properties:
      auto_round_enabled:
        type: boolean
      auto_round_interval_seconds:
        type: integer
      auto_round_last_run_at:
        type: string
      current_round:
        type: integer
      game_display_name:
        type: string
      game_id:
        type: string
      game_name:
        type: string
      is_active:
        type: boolean
      round_completed:
        type: boolean
      round_completed_at:
        type: string
      tournament_id:
        type: string
    type: object
  handlers.UpdateNameRequest:
    properties:
      name:
        type: string
    type: object
  queue.QueueStats:
    properties:
      high:
        type: integer
      low:
        type: integer
      medium:
        type: integer
      total:
        type: integer
    type: object
  team.DisqualifyResult:
    properties:
      matches_cancelled:
        type: integer
      matches_deleted:
        type: integer
      rating_history_reset:
        type: integer
    type: object
  tournament.CreateRequest:
    properties:
      description:
        type: string
      game_type:
        type: string
      is_permanent:
        type: boolean
      max_participants:
        type: integer
      max_team_size:
        type: integer
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      start_time:
        type: string
    type: object
info:
  contact: {}
  description: Tournament system for game theory competitions
  title: TJudge API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация по username/email и паролю, возвращает JWT токены
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Неверные учётные данные
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Вход в систему
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Инвалидирует access и refresh токены
      parameters:
      - description: Refresh token (опционально)
        in: body
        name: request
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает информацию о текущем аутентифицированном пользователе
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /auth/profile:
    put:
      consumes:
      - application/json
      description: Обновляет профиль текущего пользователя (email, username)
      parameters:
      - description: Данные для обновления профиля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновление профиля
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет access и refresh токены по refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "401":
          description: Невалидный refresh token
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Обновление токенов
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и возвращает JWT токены
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: Пользователь уже существует
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /games:
    get:
      description: Возвращает список доступных игр с фильтрацией и пагинацией
      parameters:
      - description: Фильтр по имени
        in: query
        name: name
        type: string
      - default: 50
        description: Лимит записей
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Game'
            type: array
      summary: Список игр
      tags:
      - games
    post:
      consumes:
      - application/json
      description: Создаёт новую игру (только для админов)
      parameters:
      - description: Данные игры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Game'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Создать игру
      tags:
      - games
  /games/{id}:
    delete:
      description: Удаляет игру по ID (только для админов)
      parameters:
      - description: Game ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Игра удалена
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Удалить игру
      tags:
      - games
    get:
      description: Возвращает игру по ID
      parameters:
      - description: Game ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Game'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Получить игру
      tags:
      - games
    put:
      consumes:
      - application/json
      description: Обновляет параметры игры (только для админов)
      parameters:
      - description: Game ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/game.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Game'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Обновить игру
      tags:
      - games
  /games/name/{name}:
    get:
      description: Возвращает игру по системному имени
      parameters:
      - description: Имя игры
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Game'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Получить игру по имени
      tags:
      - games
  /matches:
    get:
      description: Возвращает список матчей с фильтрацией и пагинацией
      parameters:
      - description: Фильтр по турниру
        format: uuid
        in: query
        name: tournament_id
        type: string
      - description: Фильтр по программе
        format: uuid
        in: query
        name: program_id
        type: string
      - description: Фильтр по статусу (pending, running, completed, failed, cancelled)
        in: query
        name: status
        type: string
      - description: Фильтр по типу игры
        in: query
        name: game_type
        type: string
      - default: 50
        description: Лимит записей
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Match'
            type: array
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Список матчей
      tags:
      - matches
  /matches/{id}:
    get:
      description: Возвращает матч по ID с фильтрацией ошибок по правам
      parameters:
      - description: Match ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Match'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Получить матч
      tags:
      - matches
  /matches/queue/clear:
    post:
      description: Очищает все очереди матчей (только для админов)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Очистить очередь матчей
      tags:
      - matches
  /matches/queue/purge:
    post:
      description: Удаляет из очереди матчи, которых нет в БД (только для админов)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
