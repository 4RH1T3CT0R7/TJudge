# TJudge self-hosted: сборка образов на месте, nginx с certbot на 80/443.
#
# Запуск: make deploy | make deploy-weak | make deploy-medium | make deploy-strong
# (scripts/quick-deploy.sh: секреты, каталоги данных, сборка, запуск).
# Вручную, из корня репозитория, после ./scripts/init-secrets.sh:
#   docker compose -f docker-compose.selfhosted.yml --env-file .env --env-file config/profiles/medium.env up -d
#
# Пароли БД и Redis и JWT_SECRET берутся только из secrets/ (*_FILE).
# DOMAIN в .env: без него сайт работает по http на localhost, с ним certbot
# выпускает сертификат и nginx сам переходит на https.

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # образ исполнителя матчей (только сборка)
  tjudge-cli:
    build:
      context: .
      dockerfile: docker/tjudge/Dockerfile
    image: tjudge-cli:latest
    entrypoint: ["echo", "tjudge-cli image built successfully"]
    restart: "no"
    networks:
      - tjudge-network

  # песочница компиляции программ (только сборка)
  tjudge-builder:
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    image: tjudge-builder:latest
    entrypoint: ["echo", "tjudge-builder image built successfully"]
    restart: "no"
    networks:
      - tjudge-network

  # наружу не публикуется: доступ через docker exec (make backup, psql)
  postgres:
    image: postgres:15-alpine
    container_name: tjudge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tjudge}
      POSTGRES_USER: ${DB_USER:-tjudge}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tjudge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: unless-stopped

  # очереди, локи и blacklist токенов: noeviction, наружу не публикуется
  redis:
    image: redis:7-alpine
    container_name: tjudge-redis
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    container_name: tjudge-migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tjudge}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=${DB_NAME:-tjudge}
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tjudge-api
    expose:
      - "8080"
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tjudge}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=${DB_NAME:-tjudge}
      # api и worker вместе держат 2 x DB_MAX_CONNECTIONS из 100 у postgres
      - DB_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-30}
      - DB_MAX_IDLE=${DB_MAX_IDLE:-5}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-50}
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      # как у worker: от него считается порог зависшего матча в /system/status
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-90s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - PROGRAMS_PATH=/data/programs
      - BASE_URL=${BASE_URL:-http://localhost}
      # без значения cross-origin запросы запрещены, а websocket в production
      # пускает только свой хост; фронт отдаётся с того же origin, ему хватает
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-100}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # тот же абсолютный путь, что HOST_PROGRAMS_PATH у worker'а: песочницы
    # монтируют файлы программ с хоста
    volumes:
      - ${HOST_PROGRAMS_PATH:-${PWD}/data/programs}:/data/programs
    networks:
      - tjudge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        # GID группы docker на хосте, quick-deploy.sh берёт его у docker.sock
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: tjudge-worker
    # non-root appuser в группе docker хоста: доступ к docker.sock без root
    user: "${WORKER_UID:-1000}:${DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9091:9090"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tjudge}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=${DB_NAME:-tjudge}
      - DB_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-30}
      - DB_MAX_IDLE=${DB_MAX_IDLE:-5}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-50}
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - WORKER_MIN=${WORKER_MIN:-2}
      - WORKER_MAX=${WORKER_MAX:-4}
      # не меньше EXECUTOR_TIMEOUT + 20s, иначе поднимается на старте
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-90s}
      - EXECUTOR_TIMEOUT=${EXECUTOR_TIMEOUT:-60s}
      - EXECUTOR_CPU_QUOTA=${EXECUTOR_CPU_QUOTA:-100000}
      - EXECUTOR_MEMORY_LIMIT=${EXECUTOR_MEMORY_LIMIT:-536870912}
      - EXECUTOR_PIDS_LIMIT=${EXECUTOR_PIDS_LIMIT:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - PROGRAMS_PATH=/data/programs
      - HOST_PROGRAMS_PATH=${HOST_PROGRAMS_PATH:-${PWD}/data/programs}
      - EXECUTOR_DOCKER_IMAGE=${EXECUTOR_DOCKER_IMAGE:-tjudge-cli:latest}
      - EXECUTOR_BUILDER_IMAGE=${EXECUTOR_BUILDER_IMAGE:-tjudge-builder:latest}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      tjudge-cli:
        condition: service_completed_successfully
      tjudge-builder:
        condition: service_completed_successfully
    volumes:
      # :ro ограничивает только операции с файлом сокета, docker API через него
      # остаётся root-эквивалентом. для реального ограничения нужен
      # docker-socket-proxy перед worker'ом (DOCKER_HOST=tcp://socket-proxy:2375)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_PROGRAMS_PATH:-${PWD}/data/programs}:/data/programs
    networks:
      - tjudge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # матчи в работе доигрываются до WORKER_TIMEOUT (до 120s в профиле weak)
    stop_grace_period: 150s
    restart: unless-stopped

  # без сертификата DOMAIN сайт идёт по http, с ним - https (entrypoint.sh)
  nginx:
    image: nginx:1.30-alpine
    container_name: tjudge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/selfhosted:/etc/nginx/tjudge:ro
      - ./deployments/nginx/selfhosted/entrypoint.sh:/docker-entrypoint.d/40-tjudge.sh:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: unless-stopped

  # периодический pg_dump в ./backups (BACKUP_INTERVAL_SECONDS), включается
  # профилем: docker compose ... --profile backup up -d backup
  backup:
    build:
      context: docker/backup
      dockerfile: Dockerfile
    container_name: tjudge-backup
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER:-tjudge}
      - PGPASSWORD_FILE=/run/secrets/db_password
      - PGDATABASE=${DB_NAME:-tjudge}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    secrets:
      - db_password
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - backup

  # выпуск сертификата для DOMAIN (кроме localhost) и продление раз в 12 часов.
  # регистрация в Let's Encrypt с CERTBOT_EMAIL, без него - без почты
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: tjudge-certbot
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        set -- --register-unsafely-without-email
        [ -n "$$CERTBOT_EMAIL" ] && set -- -m "$$CERTBOT_EMAIL"
        while :; do
          pause=12h
          if [ "$$DOMAIN" = localhost ]; then
            :
          elif [ -f "/etc/letsencrypt/live/$$DOMAIN/fullchain.pem" ]; then
            certbot renew --quiet
          elif ! certbot certonly --webroot -w /var/www/certbot -d "$$DOMAIN" \
              --agree-tos --non-interactive "$$@"; then
            # лимит Let's Encrypt - 5 неудачных проверок домена в час
            pause=15m
          fi
          sleep "$$pause" & wait $$!
        done
    depends_on:
      - nginx
    networks:
      - tjudge-network
    restart: unless-stopped

  # Prometheus (optional - comment out on very weak hardware)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tjudge-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deployments/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - tjudge-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Pushgateway: метрики батч-задач (doctor, backup) для Prometheus/Grafana
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: tjudge-pushgateway
    ports:
      - "9094:9091"
    networks:
      - tjudge-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Alertmanager: доставка алертов в Telegram (см. deployments/alertmanager/alertmanager.yml)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tjudge-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deployments/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./deployments/alertmanager/telegram_token:/etc/alertmanager/telegram_token:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - tjudge-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana (optional - comment out on very weak hardware)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tjudge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning
      - ./deployments/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - tjudge-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
  certbot_certs:
  prometheus_data:
  grafana_data:

networks:
  tjudge-network:
    driver: bridge
