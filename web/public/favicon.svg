<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <filter id="g"><feDropShadow dx="0" dy="0" stdDeviation="0.6" flood-color="#a78bfa" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#g)" transform="translate(0.8, 1)">
    <!-- Antennae -->
    <rect x="4.8" y="0" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="19.2" y="0" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="7.2" y="2" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="16.8" y="2" width="2.4" height="2" fill="#8b5cf6"/>
    <!-- Head -->
    <rect x="4.8" y="4" width="16.8" height="2" fill="#8b5cf6"/>
    <rect x="2.4" y="6" width="21.6" height="2" fill="#8b5cf6"/>
    <!-- Eye row 1 -->
    <rect x="2.4" y="8" width="4.8" height="2" fill="#8b5cf6"/>
    <rect x="7.2" y="8" width="4.8" height="2" fill="#1a0533"/>
    <rect x="12" y="8" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="14.4" y="8" width="4.8" height="2" fill="#1a0533"/>
    <rect x="19.2" y="8" width="4.8" height="2" fill="#8b5cf6"/>
    <!-- Eye row 2 -->
    <rect x="2.4" y="10" width="4.8" height="2" fill="#8b5cf6"/>
    <rect x="7.2" y="10" width="4.8" height="2" fill="#1a0533"/>
    <rect x="12" y="10" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="14.4" y="10" width="4.8" height="2" fill="#1a0533"/>
    <rect x="19.2" y="10" width="4.8" height="2" fill="#8b5cf6"/>
    <!-- Eye row 3 (wider) -->
    <rect x="0" y="12" width="7.2" height="2" fill="#8b5cf6"/>
    <rect x="7.2" y="12" width="4.8" height="2" fill="#1a0533"/>
    <rect x="12" y="12" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="14.4" y="12" width="4.8" height="2" fill="#1a0533"/>
    <rect x="19.2" y="12" width="7.2" height="2" fill="#8b5cf6"/>
    <!-- Arms + body -->
    <rect x="0" y="14" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="4.8" y="14" width="16.8" height="2" fill="#8b5cf6"/>
    <rect x="24" y="14" width="2.4" height="2" fill="#8b5cf6"/>
    <!-- Body -->
    <rect x="2.4" y="16" width="21.6" height="2" fill="#8b5cf6"/>
    <!-- Wide body -->
    <rect x="0" y="18" width="26.4" height="2" fill="#8b5cf6"/>
    <!-- Arms + body -->
    <rect x="0" y="20" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="4.8" y="20" width="16.8" height="2" fill="#8b5cf6"/>
    <rect x="24" y="20" width="2.4" height="2" fill="#8b5cf6"/>
    <!-- Lower -->
    <rect x="0" y="22" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="4.8" y="22" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="19.2" y="22" width="2.4" height="2" fill="#8b5cf6"/>
    <rect x="24" y="22" width="2.4" height="2" fill="#8b5cf6"/>
    <!-- Legs -->
    <rect x="7.2" y="24" width="4.8" height="2" fill="#8b5cf6"/>
    <rect x="14.4" y="24" width="4.8" height="2" fill="#8b5cf6"/>
    <!-- Pupils -->
    <rect x="9.6" y="9" width="1.8" height="3" fill="#fff"/>
    <rect x="16.8" y="9" width="1.8" height="3" fill="#fff"/>
  </g>
</svg>
