linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - revive
    - goconst
    - gocyclo
    - misspell
    - unconvert
    - unparam

linters-settings:
  gocyclo:
    min-complexity: 25
  goconst:
    min-len: 3
    min-occurrences: 3
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-dirs:
    - internal/mocks
    - vendor
    - web/node_modules
    - node_modules
  exclude-generated: strict
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam
        - goconst
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
