version: "2"
linters:
  enable:
    - goconst
    - gocyclo
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 25
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      # QF — это quick-fix suggestions (refactoring hints), не реальные баги.
      # Отключаем, т.к. они срабатывают на паттернах которые мы сознательно
      # используем (прямые field-access через embedded, if-else вместо switch).
      checks:
        - all
        - -QF1003
        - -QF1008
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - unparam
        path: _test\.go
    paths:
      - internal/mocks
      - vendor
      - web/node_modules
      - node_modules
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
