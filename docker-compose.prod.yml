# Production Docker Compose с Docker Secrets
# Использование: docker-compose -f docker-compose.prod.yml up -d

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tjudge-postgres-prod
    environment:
      POSTGRES_DB: tjudge
      POSTGRES_USER: tjudge
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tjudge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tjudge-redis-prod
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Database migrations
  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    container_name: tjudge-migrate-prod
    environment:
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: "no"

  # Nginx load balancer in front of API replicas.
  # Replaces the per-replica `ports:` mapping (which conflicts when replicas>1)
  # with a single ingress on host port 8080 fronting both API instances.
  nginx:
    image: nginx:1.27-alpine
    container_name: tjudge-nginx-prod
    ports:
      - "8080:80"
    volumes:
      - ./deployments/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - tjudge-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Server (behind nginx load balancer)
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-api:${VERSION:-latest}
    expose:
      - "8080"
      - "9090"
    labels:
      monitoring: "enabled"
      prometheus_job: "tjudge-api"
      prometheus_port: "9090"
      prometheus_service: "api"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
      - DB_MAX_CONNECTIONS=100
      - REDIS_HOST=tjudge-redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_ASYNC=true
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=100
      - PROGRAMS_PATH=/data/programs
      - BASE_URL=${BASE_URL:-https://tjudge.example.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-*}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - programs_data:/data/programs
    networks:
      - tjudge-network
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100M
    deploy:
      replicas: 2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Worker Pool (Prometheus scrapes via Docker DNS, no host port needed)
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-worker:${VERSION:-latest}
    expose:
      - "9090"
    labels:
      monitoring: "enabled"
      prometheus_job: "tjudge-worker"
      prometheus_port: "9090"
      prometheus_service: "worker"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
      - REDIS_HOST=tjudge-redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - WORKER_MIN=20
      - WORKER_MAX=200
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_ASYNC=true
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - EXECUTOR_DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-executor:${VERSION:-latest}
      - EXECUTOR_TIMEOUT=60s
      - EXECUTOR_DEFAULT_ITERATIONS=1000
      - PROGRAMS_PATH=/data/programs
      - HOST_PROGRAMS_PATH=${HOST_PROGRAMS_PATH}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - programs_data:/data/programs
    networks:
      - tjudge-network
      - monitoring
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Monitoring stack (Prometheus/Grafana/Loki/Alertmanager) вынесен в отдельный
  # репо infra-monitoring и работает через внешнюю docker-сеть `monitoring`.
  # Соответствующие папки конфигов в TJudge удалены — старые tjudge-*-prod
  # контейнеры запускать больше нельзя.

  # P1.14: автоматический pg_dump (prod). Включается профилем "backup":
  #   docker compose --profile backup up -d backup
  # Для внешнего storage'а (S3/R2) смонтируйте /backups через external volume
  # или добавьте rclone-sync в entrypoint.
  backup:
    build:
      context: docker/backup
      dockerfile: Dockerfile
    container_name: tjudge-backup
    environment:
      - PGHOST=postgres
      - PGUSER=tjudge
      - PGPASSWORD_FILE=/run/secrets/db_password
      - PGDATABASE=tjudge
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    secrets:
      - db_password
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: always
    security_opt:
      - no-new-privileges:true
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:
  programs_data:
  backups_data:

networks:
  tjudge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  monitoring:
    name: monitoring
    external: true
