# Production Docker Compose с Docker Secrets.
# Выкладка - .github/workflows/release.yml по тегу v*. Вручную, из ~/TJudge на
# checkout нужного тега: ./scripts/init-secrets.sh, ./scripts/prepare-data.sh,
# VERSION=<версия> docker compose -f docker-compose.prod.yml up -d
# (HOST_PROGRAMS_PATH и DOCKER_SOCK_GID release.yml пишет в .env)

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tjudge-postgres-prod
    environment:
      POSTGRES_DB: tjudge
      POSTGRES_USER: tjudge
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    labels:
      # Guardian: БД не рестартим автоматически (unhealthy при WAL-replay -
      # рестарт только удлинит восстановление), restart:always покрывает падения.
      guardian.enabled: "true"
      guardian.action: "notify-only"
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tjudge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis: очереди, локи, blacklist токенов и кэш. вытеснение ключей потеряло бы
  # матчи и локи, поэтому noeviction: при нехватке памяти запись падает с ошибкой
  redis:
    image: redis:7-alpine
    container_name: tjudge-redis-prod
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy noeviction'
    labels:
      # Guardian: как и postgres - только уведомления (AOF-load при старте).
      guardian.enabled: "true"
      guardian.action: "notify-only"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tjudge-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Миграции из образа той же версии, что api и worker
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-migrate:${VERSION:-latest}
    container_name: tjudge-migrate-prod
    environment:
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: "no"

  # Балансировщик перед репликами api. Порт только на 127.0.0.1: TLS держит
  # прокси на этом же хосте, а nginx.prod.conf верит X-Forwarded-For от шлюза
  # docker-сети. Для прокси на другом хосте - NGINX_BIND=0.0.0.0 в .env и его
  # адрес в set_real_ip_from
  nginx:
    image: nginx:1.30-alpine
    container_name: tjudge-nginx-prod
    ports:
      - "${NGINX_BIND:-127.0.0.1}:8080:80"
    labels:
      # Guardian: stateless, безопасно рестартить при unhealthy.
      guardian.enabled: "true"
    volumes:
      - ./deployments/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - tjudge-network
    restart: always
    healthcheck:
      # 127.0.0.1, не localhost: в alpine localhost резолвится и в ::1,
      # а nginx слушает только IPv4 - busybox-wget получал connection refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Server (behind nginx load balancer)
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-api:${VERSION:-latest}
    expose:
      - "8080"
      - "9090"
    labels:
      monitoring: "enabled"
      prometheus_job: "tjudge-api"
      prometheus_port: "9090"
      prometheus_service: "api"
      guardian.enabled: "true"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
      # бюджет max_connections postgres (100): api 2x25 + worker 2x15 = 80,
      # остаток на migrate, бэкап и ручной psql
      - DB_MAX_CONNECTIONS=25
      - DB_MAX_IDLE=5
      - REDIS_HOST=tjudge-redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      # как у worker: от него считается порог зависшего матча в /system/status
      - WORKER_TIMEOUT=90s
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_ASYNC=true
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=100
      # X-Forwarded-For разбирается только от nginx из tjudge-network
      - TRUSTED_PROXIES=172.28.0.0/16
      - PROGRAMS_PATH=/data/programs
      - BASE_URL=${BASE_URL:-https://tjudge.example.com}
      # фронт отдаётся с того же origin. CORS по умолчанию - только BASE_URL
      # (пустое значение дало бы dev-дефолт localhost:3000), websocket в
      # production без списка пускает только свой хост
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-${BASE_URL:-https://tjudge.example.com}}
      - WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # тот же каталог хоста монтируют песочницы worker'а (HOST_PROGRAMS_PATH),
    # его готовит scripts/prepare-data.sh
    volumes:
      - ${HOST_PROGRAMS_PATH:?HOST_PROGRAMS_PATH - абсолютный путь к data/programs}:/data/programs
    networks:
      - tjudge-network
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100M
    deploy:
      replicas: 2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Worker Pool (Prometheus scrapes via Docker DNS, no host port needed)
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-worker:${VERSION:-latest}
    expose:
      - "9090"
    labels:
      monitoring: "enabled"
      prometheus_job: "tjudge-worker"
      prometheus_port: "9090"
      prometheus_service: "worker"
      guardian.enabled: "true"
    environment:
      - ENVIRONMENT=production
      - DB_HOST=tjudge-postgres-prod
      - DB_PORT=5432
      - DB_USER=tjudge
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=tjudge
      - DB_MAX_CONNECTIONS=15
      - DB_MAX_IDLE=5
      - REDIS_HOST=tjudge-redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      # на реплику; каждый воркер держит матч-контейнер с квотой в ядро,
      # поэтому WORKER_MAX x replicas ~ число ядер хоста (задаётся в .env)
      - WORKER_MIN=2
      - WORKER_MAX=${WORKER_MAX:-4}
      # EXECUTOR_TIMEOUT + запас на запуск контейнера и запись результата
      - WORKER_TIMEOUT=90s
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_ASYNC=true
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
      - EXECUTOR_DOCKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-executor:${VERSION:-latest}
      - EXECUTOR_BUILDER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER:-4rh1t3ct0r7}/tjudge-builder:${VERSION:-latest}
      - EXECUTOR_TIMEOUT=60s
      - EXECUTOR_DEFAULT_ITERATIONS=1000
      - PROGRAMS_PATH=/data/programs
      - HOST_PROGRAMS_PATH=${HOST_PROGRAMS_PATH}
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_PROGRAMS_PATH:?HOST_PROGRAMS_PATH - абсолютный путь к data/programs}:/data/programs
    # Доступ non-root пользователя (1000) к docker.sock: GID группы docker
    # ХОСТА добавляется как supplementary group. В образ запечён дефолт 999
    # (build-arg DOCKER_GID), но GID хоста может отличаться - задайте в .env:
    #   DOCKER_SOCK_GID=$(getent group docker | cut -d: -f3)
    group_add:
      - "${DOCKER_SOCK_GID:-999}"
    networks:
      - tjudge-network
      - monitoring
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # на старте worker проверяет образы песочниц и убирает осиротевшие контейнеры
      start_period: 120s
    # на остановке матчи в работе доигрываются до WORKER_TIMEOUT, потом отмена
    stop_grace_period: 120s
    deploy:
      replicas: 2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Monitoring stack (Prometheus/Grafana/Loki/Alertmanager) вынесен в отдельный
  # репо infra-monitoring и работает через внешнюю docker-сеть `monitoring`.
  # Соответствующие папки конфигов в TJudge удалены — старые tjudge-*-prod
  # контейнеры запускать больше нельзя.

  # pg_dump и архив программ раз в сутки в ./backups (docker/backup/entrypoint.sh),
  # копия до 50 МБ - в Telegram, только при BACKUP_TELEGRAM_CHAT_ID в .env (дамп с
  # персональными данными, чат задаётся отдельно от алертов).
  # Включается профилем: docker compose -f docker-compose.prod.yml --profile backup up -d backup
  backup:
    build:
      context: docker/backup
      dockerfile: Dockerfile
    container_name: tjudge-backup
    environment:
      - PGHOST=postgres
      - PGUSER=tjudge
      - PGPASSWORD_FILE=/run/secrets/db_password
      - PGDATABASE=tjudge
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BACKUP_TELEGRAM_CHAT_ID=${BACKUP_TELEGRAM_CHAT_ID:-}
    secrets:
      - db_password
    volumes:
      - ./backups:/backups
      - ${HOST_PROGRAMS_PATH:?HOST_PROGRAMS_PATH - абсолютный путь к data/programs}:/data/programs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tjudge-network
    restart: always
    security_opt:
      - no-new-privileges:true
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:

networks:
  tjudge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  monitoring:
    name: monitoring
    external: true
