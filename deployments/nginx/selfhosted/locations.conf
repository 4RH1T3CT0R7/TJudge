# общая часть http.conf и https.conf

# как MaxBodySize у /programs в api
client_max_body_size 10m;

# api резолвится на каждый запрос: после пересоздания контейнера у него новый ip
resolver 127.0.0.11 valid=10s ipv6=off;

location / {
    set $api_target "api:8080";
    proxy_pass http://$api_target$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # адрес клиента выставляет только nginx, присланные клиентом
    # X-Forwarded-For и True-Client-IP до api не доходят
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /api/v1/ws/ {
    set $api_target "api:8080";
    proxy_pass http://$api_target$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
