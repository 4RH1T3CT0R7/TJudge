# Алерты TJudge по SLO.
# Имена метрик - internal/metrics/metrics.go.

groups:
  - name: tjudge-availability
    rules:
      # API недоступен - главный CRIT (SLO: availability >= 99.5%/28d).
      - alert: APIDown
        expr: up{job="tjudge-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API недоступен"
          description: "Prometheus не может скрейпить метрики API (порт 9090) уже 1 минуту."

      - alert: WorkerDown
        expr: up{job="tjudge-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker недоступен"
          description: "Матчи не обрабатываются: worker не отвечает на скрейп 2 минуты."

      # SLO: 5xx < 0.5% за 1h; алерт - ранний сигнал на 10м окне.
      - alert: APIHighErrorRate
        expr: |
          sum(rate(tjudge_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(tjudge_http_requests_total[5m])) > 0.005
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "5xx rate > 0.5% в течение 10 минут"

      # SLO: P99 read < 1s (по всем ручкам; write-пороги уточняются по факту).
      - alert: APIHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(tjudge_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API P99 latency > 1s в течение 15 минут"

  - name: tjudge-queue
    rules:
      # Большая очередь на старте раунда - штатная ситуация, тревожно только
      # когда воркеры заняты матчами, а завершений (включая failed) нет.
      # WORKER_TIMEOUT 90s, так что 10 минут без завершений - зависание.
      - alert: QueueStuck
        expr: |
          sum(tjudge_active_workers) > 0
            unless on() sum(increase(tjudge_matches_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Воркеры заняты, но ни один матч не завершился за 10 минут"
          description: "Матчи не разбираются: проверь worker и Docker daemon."

      - alert: DeadLetterGrowing
        expr: increase(tjudge_queue_deadletter_push_total[10m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter очередь растёт (>10 за 10 минут)"
          description: "Повреждённые задачи в очереди: смотри логи worker'а."

  - name: tjudge-worker
    rules:
      - alert: WorkerDrainTooSlow
        expr: |
          histogram_quantile(0.99,
            rate(tjudge_worker_drain_duration_seconds_bucket[1h])) > 90
        labels:
          severity: warning
        annotations:
          summary: "Drain пула воркеров P99 > 90s"

      - alert: MatchFailureRateHigh
        expr: |
          sum(rate(tjudge_matches_total{status="failed"}[15m]))
            / clamp_min(sum(rate(tjudge_matches_total[15m])), 0.0001) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "> 20% матчей фейлится 15 минут подряд"
          description: "Возможны проблемы executor'а/образов, а не программ участников."

  - name: tjudge-db
    rules:
      # Лимит общий на сервер: сумма по всем репликам api и worker против
      # max_connections Postgres. Экспортёра Postgres нет, поэтому 100 -
      # дефолт postgres:15, compose его не переопределяет; при смене
      # max_connections порог правится вместе с ним.
      - alert: DBConnectionsNearLimit
        expr: sum(tjudge_db_connections{state="open"}) > 0.85 * 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Открыто > 85% от max_connections Postgres"
          description: "При исчерпании Postgres отвечает too many clients: уменьшить DB_MAX_CONNECTIONS или реплики."
