# Алерты по результатам TJudge Doctor (scripts/doctor.sh → Pushgateway).
# Дублируют Telegram-отчёт самого doctor'а на случай, когда doctor запущен
# без TELEGRAM_* (например, из cron под другим окружением).

groups:
  - name: tjudge-doctor
    rules:
      - alert: DoctorCritical
        expr: tjudge_doctor_problems{severity="crit"} > 0
        labels:
          severity: critical
        annotations:
          summary: "Doctor нашёл критичные проблемы"
          description: "Запустите make doctor на сервере или откройте дашборд «TJudge — Doctor» за деталями."

      - alert: DoctorDegraded
        expr: tjudge_doctor_problems{severity="warn"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Doctor видит предупреждения дольше 30 минут"
          description: "Дашборд «TJudge — Doctor»: какие именно проверки в состоянии warn."

      # Если doctor стоит в cron и перестал отрабатывать - это тоже сигнал.
      # 26 часов: суточный cron + запас. Не сработает, пока doctor ни разу
      # не запускался (метрики нет - выражение пустое).
      - alert: DoctorStale
        expr: time() - tjudge_doctor_last_run_timestamp_seconds > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: "Doctor не запускался больше 26 часов"
          description: "Проверьте cron/CI-хук, запускающий scripts/doctor.sh."
