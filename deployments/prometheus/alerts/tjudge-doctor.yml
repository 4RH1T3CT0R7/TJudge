# Алерты по результатам TJudge Doctor (scripts/doctor.sh -> Pushgateway).
# О проблемах doctor пишет в Telegram сам, когда их набор меняется, поэтому
# здесь только сигнал, что doctor перестал запускаться.

groups:
  - name: tjudge-doctor
    rules:
      # 2 часа: cron раз в 30 минут (docs/OPERATIONS.md) + запас. Не сработает,
      # пока doctor ни разу не запускался (метрики нет - выражение пустое).
      - alert: DoctorStale
        expr: time() - tjudge_doctor_last_run_timestamp_seconds > 2 * 3600
        labels:
          severity: warning
        annotations:
          summary: "Doctor не запускался больше 2 часов"
          description: "Проверьте cron/CI-хук, запускающий scripts/doctor.sh."
