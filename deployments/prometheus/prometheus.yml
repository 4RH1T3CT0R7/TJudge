# Prometheus-конфигурация TJudge.
# Монтируется в docker-compose.selfhosted.yml (профиль monitoring).
# Алерты: alerts/*.yml (пороги - docs/SLO.md).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Имена job'ов tjudge-api/tjudge-worker - ЕДИНЫЕ с центральной системой
  # infra-monitoring (там они приходят из docker-лейблов prometheus_job):
  # дашборды и алерты работают одинаково в обоих режимах.
  #
  # API-сервер: HTTP-метрики, БД, кэш, очередь (продюсер).
  # ВАЖНО: метрики API на отдельном порту 9090 (METRICS_PORT), не на 8080.
  # dns_sd вместо static: docker-DNS возвращает ВСЕ реплики сервиса
  # (в prod api/worker по 2 реплики) - каждая скрейпится отдельно.
  - job_name: tjudge-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9090

  # Worker: пул, executor, очередь (консьюмер). METRICS_PORT=9090.
  - job_name: tjudge-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9090

  # Pushgateway: метрики doctor'а и других батч-задач.
  # honor_labels - чтобы лейблы job/instance из push'а не перетирались.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
