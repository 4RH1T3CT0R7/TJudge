# P2.10: Alertmanager с опциональным Slack/Email.
# Значения configurable через env-substitution в Alertmanager v0.27+ не поддерживается
# напрямую, поэтому реальные секреты подставляются через envsubst в CI/deploy
# скрипте либо через docker secrets (mount template + entrypoint).
#
# В текущей конфигурации webhook в internal API остаётся по умолчанию,
# Slack/Email — опциональные routes (закомментированы; раскомментируйте и замените
# URL/credentials перед выкатом в прод).

global:
  resolve_timeout: 5m

  # SMTP (раскомментируйте и заполните для email-уведомлений):
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@tjudge.example.com'
  # smtp_auth_username: 'alertmanager@tjudge.example.com'
  # smtp_auth_password_file: '/etc/alertmanager/smtp_password'
  # smtp_require_tls: true

  # Slack (раскомментируйте и заполните webhook URL):
  # slack_api_url_file: '/etc/alertmanager/slack_url'

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

  routes:
    # Критические алерты — немедленный page.
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: true   # Также отправить default-receiver'ам.

    - match:
        service: database
      receiver: 'database-receiver'

    - match:
        alertname: HighLoad
      receiver: 'ops-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://api:8080/internal/webhook/alerts'
        send_resolved: true
    # Slack для прод (раскомментируйте после настройки global.slack_api_url_file):
    # slack_configs:
    #   - channel: '#tjudge-alerts'
    #     send_resolved: true
    #     title: '{{ template "slack.default.title" . }}'
    #     text:  '{{ template "slack.default.text" . }}'

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://api:8080/internal/webhook/critical'
        send_resolved: true
    # Email для on-call (раскомментируйте после настройки global.smtp_smarthost):
    # email_configs:
    #   - to: 'oncall@tjudge.example.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '[TJudge CRIT] {{ .CommonAnnotations.summary }}'
    # Slack для критов (отдельный канал):
    # slack_configs:
    #   - channel: '#tjudge-oncall'
    #     send_resolved: true
    #     color: 'danger'
    #     title: '{{ template "slack.default.title" . }}'
    #     text:  '{{ template "slack.default.text" . }}'

  - name: 'database-receiver'
    webhook_configs:
      - url: 'http://api:8080/internal/webhook/database'
        send_resolved: true

  - name: 'ops-receiver'
    webhook_configs:
      - url: 'http://api:8080/internal/webhook/ops'
        send_resolved: true

inhibit_rules:
  - source_match: { severity: 'critical' }
    target_match: { severity: 'warning' }
    equal: ['alertname', 'service']

  - source_match: { alertname: 'ClusterDown' }
    target_match_re: { alertname: '.+' }
    equal: ['cluster']

templates:
  - '/etc/alertmanager/templates/*.tmpl'
