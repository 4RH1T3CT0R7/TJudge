# Alertmanager TJudge.
#
# Получатель выбирается на старте в entrypoint.sh: при заданных в .env
# TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID (тот же бот, что у doctor и бэкапов)
# алерты уходят в Telegram, без них - в пустой получатель null.
# receivers - последний раздел файла: entrypoint.sh дописывает в него telegram.

route:
  receiver: 'null'
  # Критические алерты - сразу; warning - группируются на 5 минут.
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # Когда API лежит целиком, не спамить latency/error-rate алертами.
  - source_matchers:
      - alertname = APIDown
    target_matchers:
      - alertname =~ "APIHighErrorRate|APIHighLatencyP99"

receivers:
  - name: 'null'
