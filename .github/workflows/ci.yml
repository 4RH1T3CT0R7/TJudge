name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install deps
        run: npm ci
        working-directory: web

      - name: lint
        run: npm run lint
        working-directory: web

      - name: tests
        run: npm test
        working-directory: web

      - name: build
        run: npm run build
        working-directory: web

      # dist нужен go-джобе: бинарник встраивает фронтенд через go:embed
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          retention-days: 1

  go:
    runs-on: ubuntu-latest
    needs: frontend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tjudge
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tjudge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: tjudge
      DB_PASSWORD: secret
      DB_NAME: tjudge_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist

      - name: deps
        run: go mod download

      - name: vet
        run: go vet ./...

      # ставим go install чтобы линтер собрался под наш go
      # версию пиним, @latest ломает ci на каждом релизе линтера
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          golangci-lint run --timeout=5m ./...

      - name: migrations
        run: go run cmd/migrations/main.go up

      - name: tests
        run: go test -count=1 ./...

      - name: build
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker
          go build -o bin/migrate ./cmd/migrations

      - name: integration tests
        env:
          RUN_INTEGRATION: true
          JWT_SECRET: test-jwt-secret-for-ci
        run: go test -tags=integration -timeout=10m ./tests/integration/...
