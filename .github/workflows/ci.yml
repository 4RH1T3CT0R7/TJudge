name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml гоняет те же проверки на теге до сборки образов
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install deps
        run: npm ci
        working-directory: web

      # типы фронта генерятся из docs/openapi.yaml: diff значит, что спеку
      # поменяли без перегенерации (или наоборот)
      - name: openapi codegen freshness
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated
        working-directory: web

      - name: lint
        run: npm run lint
        working-directory: web

      - name: tests
        run: npm test
        working-directory: web

      - name: build
        run: npm run build
        working-directory: web

      # dist нужен go-джобе: бинарник встраивает фронтенд через go:embed
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          retention-days: 1

  # отдельная джоба: уязвимость в зависимости не должна блокировать go-тесты
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install deps
        run: npm ci
        working-directory: web

      - name: audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  go:
    runs-on: ubuntu-latest
    needs: frontend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tjudge
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tjudge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: tjudge
      DB_PASSWORD: secret
      DB_NAME: tjudge_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist

      - name: deps
        run: go mod download

      - name: vet
        run: go vet -tags=integration,e2e,security ./...

      # go install, иначе бинарь линтера не собирается под go 1.26
      # версия пинится, @latest ломает ci на каждом релизе линтера.
      # теги - чтобы тесты под ними не гнили незаметно
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          golangci-lint run --timeout=5m --build-tags=integration,e2e,security ./...

      # падает только на достижимых уязвимостях вне allowlist.
      # allowlist: у github.com/docker/docker фикса в этом пути модуля нет (moby
      # переехал в github.com/moby/moby), обе про демон и authz-плагины, а не
      # клиентский SDK executor'а
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          rc=0
          govulncheck ./... > vuln.txt || rc=$?
          cat vuln.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          new=$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' vuln.txt | awk '{print $3}' | grep -vxE 'GO-2026-4887|GO-2026-4883' || true)
          if [ -n "$new" ]; then echo "уязвимости вне allowlist:"; echo "$new"; exit 1; fi

      # up -> откат до пустой схемы -> up: down-миграции тоже должны работать.
      # down откатывает один шаг, version на пустой схеме завершается с ошибкой
      - name: migrations
        run: |
          go build -o bin/migrate ./cmd/migrations
          bin/migrate up
          while bin/migrate version >/dev/null 2>&1; do bin/migrate down; done
          bin/migrate up

      - name: tests
        run: go test -race -count=1 ./...

      - name: build
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker
          go build -o bin/migrate ./cmd/migrations

      # -p 1: пакеты делят одну БД и чистят её по шаблонам, параллельно флакают
      - name: integration tests
        env:
          RUN_INTEGRATION: true
          JWT_SECRET: test-jwt-secret-for-ci
        run: go test -race -count=1 -p 1 -tags=integration -timeout=10m ./internal/storage/... ./tests/integration/...

      # api без worker'а: e2e (полный цикл с компиляцией - в nightly) и security
      # проверяют http-контракт, authn/authz и лимиты тела
      - name: e2e and security tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          PROGRAMS_PATH: ${{ runner.temp }}/programs
          E2E_API_URL: http://localhost:8080
        run: |
          ./bin/api > api.log 2>&1 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          go test -count=1 -tags=e2e ./tests/e2e/...
          go test -count=1 -tags=security ./tests/security/...

      - name: api log
        if: failure()
        run: cat api.log || true
