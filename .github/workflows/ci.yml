          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tjudge
          DB_PASSWORD: secret
          DB_NAME: tjudge_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: go test -v -tags=chaos -timeout=20m ./tests/chaos/...
