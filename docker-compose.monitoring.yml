# Мониторинг-стек TJudge для prod (docker-compose.prod.yml).
#
# api и worker из prod-compose подключены к внешней сети `monitoring` -
# этот стек живёт в той же сети и скрейпит их по DNS-именам сервисов
# (dns_sd_configs в deployments/prometheus/prometheus.yml видит ВСЕ реплики).
#
# Запуск на сервере:
#   docker network create monitoring 2>/dev/null || true
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Если уже работает старый Prometheus вне этой сети (доктор: «Prometheus
# НЕ скрейпит API») - остановите его и поднимите стек этой командой.
#
# Порты: Prometheus 9092, Alertmanager 9093, Pushgateway 9094, Grafana 3000.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tjudge-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tjudge-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deployments/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deployments/alertmanager/telegram_token:/etc/alertmanager/telegram_token:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - monitoring
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: tjudge-pushgateway
    ports:
      - "9094:9091"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tjudge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: monitoring
    external: true
